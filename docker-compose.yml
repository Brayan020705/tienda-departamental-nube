services:
  postgres_ordenes:
    image: postgres:16-alpine
    container_name: db_postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db-init/01_postgres.sql:/docker-entrypoint-initdb.d/01_postgres.sql
    networks:
      - tienda-net

  mongo_catalogo:
    image: mongo:7.0
    container_name: db_mongo
    restart: unless-stopped
    env_file: .env
    volumes:
      - mongo_data:/data/db
      - ./db-init/02_mongo.js:/docker-entrypoint-initdb.d/02_mongo.js
    networks:
      - tienda-net

  redis_carrito:
    image: redis:7-alpine
    container_name: db_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - tienda-net

  api_catalogo:
    build: ./servicio-catalogo
    container_name: api_catalogo
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - mongo_catalogo
      - redis_carrito
    networks:
      - tienda-net

  api_carrito:
    build: ./servicio-carrito
    container_name: api_carrito
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      - redis_carrito
    networks:
      - tienda-net

  api_ordenes:
    build: ./servicio-ordenes
    container_name: api_ordenes
    restart: unless-stopped
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      - postgres_ordenes
      - api_carrito
      - api_catalogo
    networks:
      - tienda-net

volumes:
  pg_data:
  mongo_data:
  redis_data:

networks:
  tienda-net:
    driver: bridge